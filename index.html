<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://cdn.prod.website-files.com/686c09a33211842a0ac0183d/689b29bd3caff6492c34a95c_More-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More Nutrition - Matcha meets Protein</title>
    <meta content="Discover the More Nutrition Iced Matcha Latte in a whole new way: 20 g protein, 85 mg caffeine, 95% less sugar, refreshing, light and full of flavor." name="description" />
    
    <!-- Webflow Base CSS (for base styles only) -->
    <link href="https://cdn.prod.website-files.com/686c09a33211842a0ac0183d/css/more-nutrition.shared.e35377ec8.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Main Custom CSS (local copy) -->
    <link rel="stylesheet" href="/styles/main.css" />
    
    <!-- Load GSAP and plugins from CDN (required by app.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
    
    <!-- SplitText polyfill (premium plugin alternative) -->
    <script>
      // Simple SplitText polyfill for basic text splitting functionality
      window.SplitText = class SplitText {
        constructor(element, options = {}) {
          this.element = typeof element === 'string' ? document.querySelector(element) : element;
          this.options = options;
          this.words = [];
          this.lines = [];
          this.chars = [];
          
          if (this.element) {
            this.split();
          }
        }
        
        static create(element, options) {
          return new SplitText(element, options);
        }
        
        split() {
          const text = this.element.textContent || '';
          const type = this.options.type || 'words';
          
          // Store original HTML
          this.originalHTML = this.element.innerHTML;
          
          if (type.includes('words') || type.includes('lines')) {
            const words = text.trim().split(/\s+/);
            const wordsClass = this.options.wordsClass || 'split-word';
            const linesClass = this.options.linesClass || 'split-line';
            
            this.element.innerHTML = words.map(word => 
              `<span class="${wordsClass}" style="display: inline-block;">${word}</span>`
            ).join(' ');
            
            this.words = Array.from(this.element.querySelectorAll('.' + wordsClass));
            
            // For lines, we treat the whole thing as one line for simplicity
            if (type.includes('lines')) {
              const wrapper = document.createElement('span');
              wrapper.className = linesClass;
              wrapper.style.display = 'block';
              while (this.element.firstChild) {
                wrapper.appendChild(this.element.firstChild);
              }
              this.element.appendChild(wrapper);
              this.lines = [wrapper];
            }
          }
          
          if (type.includes('chars')) {
            const chars = text.split('');
            const charsClass = this.options.charsClass || 'split-char';
            this.element.innerHTML = chars.map(char => 
              char === ' ' ? ' ' : `<span class="${charsClass}" style="display: inline-block;">${char}</span>`
            ).join('');
            this.chars = Array.from(this.element.querySelectorAll('.' + charsClass));
          }
        }
        
        revert() {
          if (this.originalHTML) {
            this.element.innerHTML = this.originalHTML;
          }
        }
      };
      
      // Register with GSAP if available
      if (window.gsap) {
        gsap.registerPlugin(SplitText);
      }
    </script>
    
    <!-- DrawSVG polyfill (premium plugin alternative) -->
    <script>
      // Simple DrawSVG polyfill using stroke-dasharray/dashoffset
      if (window.gsap) {
        gsap.registerPlugin({
          name: "drawSVG",
          init(target, value) {
            if (target.tagName === 'path' || target.tagName === 'line' || target.tagName === 'circle' || target.tagName === 'ellipse' || target.tagName === 'rect' || target.tagName === 'polygon' || target.tagName === 'polyline') {
              const length = target.getTotalLength ? target.getTotalLength() : 100;
              target.style.strokeDasharray = length;
              
              // Parse value like "0% 100%" or "100% 100%"
              let start = 0, end = length;
              if (typeof value === 'string') {
                const match = value.match(/(\d+)%?\s*(\d+)?%?/);
                if (match) {
                  start = (parseFloat(match[1]) / 100) * length;
                  end = match[2] ? (parseFloat(match[2]) / 100) * length : length;
                }
              }
              
              this.target = target;
              this.length = length;
              this.startOffset = length - start;
              this.endOffset = length - end;
            }
            return true;
          },
          render(progress) {
            if (this.target) {
              const offset = this.startOffset + (this.endOffset - this.startOffset) * progress;
              this.target.style.strokeDashoffset = offset;
            }
          }
        });
      }
    </script>

    <script type="text/javascript">
      // Add Webflow modifier classes
      (function(o, c) {
        var n = c.documentElement,
            t = " w-mod-";
        n.className += t + "js";
        if ("ontouchstart" in o || (o.DocumentTouch && c instanceof DocumentTouch)) {
          n.className += t + "touch";
        }
      })(window, document);
    </script>
    
    <style>
      /* Loader styles */
      .loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background-color: rgba(182, 203, 165, 0.99);
        display: grid;
        place-content: flex-end;
        padding-right: 2.5em;
        padding-bottom: 2.5em;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      
      html.is-ready .loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader::before {
        content: "";
        z-index: 1;
        pointer-events: none;
        mix-blend-mode: color-burn;
        background-image: url(https://cdn.prod.website-files.com/686c09a33211842a0ac0183d/68b0b1e2ae528702c898a058_pattern.png);
        background-position: 0 0;
        background-size: 7rem 7rem;
        position: absolute;
        inset: 0%;
      }

      .loader::after {
        content: "";
        height: 1.25em;
        width: 1.25em;
        border: 0.125em solid #335c30;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
        transition: opacity 0.25s ease;
      }

      html.has-seq-ready .loader::after {
        opacity: 0;
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Scaling System */
      :root {
        --size-unit: 16;
        --size-container-ideal: 1440;
        --size-container-min: 992px;
        --size-container-max: 2560px;
        --size-container: clamp(var(--size-container-min), 100vw, var(--size-container-max));
        --size-font: calc(var(--size-container) / (var(--size-container-ideal) / var(--size-unit)));
      }

      @media screen and (max-width: 991px) {
        :root {
          --size-container-ideal: 640;
          --size-container-min: 768px;
          --size-container-max: 991px;
        }
      }

      @media screen and (max-width: 767px) {
        :root {
          --size-container-ideal: 550;
          --size-container-min: 480px;
          --size-container-max: 767px;
        }
      }

      @media screen and (max-width: 479px) {
        :root {
          --size-container-ideal: 390;
          --size-container-min: 320px;
          --size-container-max: 479px;
        }
      }

      body {
        font-size: var(--size-font);
      }

      .container {
        max-width: var(--size-container);
      }

      .container.medium {
        max-width: calc(var(--size-container) * 0.85);
      }

      .container.small {
        max-width: calc(var(--size-container) * 0.7);
      }

      /* Lenis smooth scroll styles */
      html.lenis, html.lenis body {
        height: auto;
      }

      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }

      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }

      .lenis.lenis-stopped {
        overflow: hidden;
      }
      
      /* Override: Ensure scroll works after page is ready */
      html.is-ready.lenis-stopped {
        overflow: auto !important;
      }

      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }
    </style>
  </head>
  <body class="body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback: Force hide loader and enable scrolling after 4 seconds
      setTimeout(function() {
        if (!document.documentElement.classList.contains('is-ready')) {
          console.log('Fallback: Forcing loader to hide and enabling scroll');
          document.documentElement.classList.add('fonts-loaded', 'is-ready', 'has-seq-ready');
        }
        // Remove lenis-stopped class if present (blocks scrolling)
        document.documentElement.classList.remove('lenis-stopped');
        document.body.classList.remove('lenis-stopped');
        // Ensure scrolling is enabled
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        
        // Try to start Lenis if it exists and is stopped
        if (window.lenis) {
          window.lenis.start();
        }
      }, 4000);
      
      // Fix for Lenis blocking native scroll - ensure it's started
      setTimeout(function() {
        // If Lenis exists but scroll still doesn't work, force native scroll
        if (document.documentElement.classList.contains('lenis-stopped')) {
          document.documentElement.classList.remove('lenis', 'lenis-stopped');
          document.body.classList.remove('lenis', 'lenis-stopped');
          console.log('Forced native scroll mode');
        }
      }, 6000);
      
      // Also enable scroll immediately if there are any JS errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Error caught, enabling scroll fallback:', msg);
        document.documentElement.classList.add('fonts-loaded', 'is-ready', 'has-seq-ready');
        document.documentElement.classList.remove('lenis-stopped');
        document.body.classList.remove('lenis-stopped');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        return false;
      };
    </script>
  </body>
</html>
