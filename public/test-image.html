<!DOCTYPE html>
<html>
<head>
    <title>Image Aspect Ratio Test</title>
</head>
<body>
    <h1>Testing Image Dimensions</h1>
    <img id="testImg" src="/img/hypeBamvideo001.webp" style="max-width: 500px;">
    <div id="info"></div>
    
    <script>
        const img = document.getElementById('testImg');
        img.onload = function() {
            const info = document.getElementById('info');
            info.innerHTML = `
                <p><strong>Natural Width:</strong> ${img.naturalWidth}px</p>
                <p><strong>Natural Height:</strong> ${img.naturalHeight}px</p>
                <p><strong>Aspect Ratio:</strong> ${(img.naturalWidth / img.naturalHeight).toFixed(4)}</p>
                <p><strong>Ratio Description:</strong> ${img.naturalWidth}:${img.naturalHeight}</p>
            `;
        };
    </script>
</body>
</html>
